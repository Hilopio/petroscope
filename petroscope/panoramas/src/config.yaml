#   panoramas_dir: "/home/g.nikolaev/data/panoramas"

dirs:
  datasets_dir: "/home/g.nikolaev/data/metal_tiles"
  cache_dir: "/home/g.nikolaev/data/metal_cache"
  panoramas_dir: "/home/g.nikolaev/data/metal_panoramas"

log:
  detailed_log: True

vizualization:
  draw_inliers: True

stitching_mode: 'undistort_and_stitch_collage'
