match:
  device:  'cuda:5'  # 'cpu'  # 
  batch_size: 10
  inference_size: [600, 400]
  matcher_weights: '/home/g.nikolaev/petroscope/petroscope/panoramas/weights/loftr_outdoor.ckpt'

align:
  transformation_type: 'projective'  # 'affine' or 'projective'
  confidence_tr: 0.95
  min_inliers: 5
  max_inliers: 30
  min_inlier_rate: 0.0
  reproj_tr: 1.0
  n_recenterings: 5
  use_bundle_adjustment: True

compose:
  use_gain_comp: True
  use_graphcut: True
  use_blending: True

gain_comp:
  save_mean_color: True

graphcut:
  coarse_scale: 4
  fine_scale: 16
  lane_width: 200

blending:
  n_levels: 7

